<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New year countdown</title>
    <link
      rel="icon"
      href="image/2026-happy-new-year-background-design-vector.jpg"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="new-year-container container">
      <h1 class="mb-5">🎆 New Year Countdown 🎆</h1>
      <div class="row">
        <div class="time-container col-md-3 col-6 mb-5 my-3">
          <div class="time" id="days">00</div>
          <div class="label">days</div>
        </div>
        <div class="time-container col-md-3 col-6 mb-5 my-3">
          <div class="time" id="hours">00</div>
          <div class="label">hours</div>
        </div>
        <div class="time-container col-md-3 col-6 mb-5 my-3">
          <div class="time" id="minutes">00</div>
          <div class="label">minutes</div>
        </div>
        <div class="time-container col-md-3 col-6 mb-5 my-3">
          <div class="time" id="seconds">00</div>
          <div class="label">seconds</div>
        </div>
      </div>
      <p class="">until january 1st, 2026</p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
